<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="100%" height="100%" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="uiHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="apiHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="mlHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="storageHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="adapterHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f472b6"/>
    </marker>
    <filter id="dropShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="860" rx="16" fill="url(#bgGrad)"/>

  <!-- Title Banner -->
  <text x="40" y="46" fill="#f8fafc" font-size="24" font-weight="700" letter-spacing="0.5">FreightIQ — Maritime Freight Forecasting &amp; Chartering Optimization Architecture</text>
  <text x="40" y="70" fill="#94a3b8" font-size="13">React 19 + TypeScript 6.0 (Vite 8) • FastAPI 0.115 + Pydantic v2 • SARIMAX Log-Space Kalman Engine • Berth-Level Resolver • SQLite WAL Cache</text>

  <!-- ==================== TIER 1: REACT 19 OPERATIONAL COMMAND DECK ==================== -->
  <g filter="url(#dropShadow)">
    <rect x="35" y="95" width="730" height="190" rx="12" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="35" y="95" width="730" height="34" rx="12" fill="url(#uiHeader)"/>
    <text x="55" y="117" fill="#ffffff" font-size="13" font-weight="700" letter-spacing="0.8">CLIENT TIER — REACT 19 + TYPESCRIPT 6.0 COMMAND DECK (PORT 5173)</text>

    <!-- Pages Group 1 -->
    <rect x="52" y="142" width="165" height="62" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="134" y="162" fill="#e0f2fe" font-size="12" font-weight="600" text-anchor="middle">Command &amp; Geospatial</text>
    <text x="134" y="178" fill="#94a3b8" font-size="10" text-anchor="middle">CommandCenter (/) • Map (/map)</text>
    <text x="134" y="193" fill="#94a3b8" font-size="10" text-anchor="middle">React-Leaflet 5 • RiskAlerts</text>

    <!-- Pages Group 2 -->
    <rect x="229" y="142" width="165" height="62" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="311" y="162" fill="#e0f2fe" font-size="12" font-weight="600" text-anchor="middle">Forecasting &amp; Timing</text>
    <text x="311" y="178" fill="#94a3b8" font-size="10" text-anchor="middle">Forecast (/forecast)</text>
    <text x="311" y="193" fill="#94a3b8" font-size="10" text-anchor="middle">MarketTiming • Recharts 3.10</text>

    <!-- Pages Group 3 -->
    <rect x="406" y="142" width="165" height="62" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="488" y="162" fill="#e0f2fe" font-size="12" font-weight="600" text-anchor="middle">Berth &amp; Fleet Planning</text>
    <text x="488" y="178" fill="#94a3b8" font-size="10" text-anchor="middle">Matcher (/matcher)</text>
    <text x="488" y="193" fill="#94a3b8" font-size="10" text-anchor="middle">IdlePlanner • VoyageEditor</text>

    <!-- Pages Group 4 -->
    <rect x="583" y="142" width="165" height="62" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="665" y="162" fill="#e0f2fe" font-size="12" font-weight="600" text-anchor="middle">Spot vs CVC / PTC</text>
    <text x="665" y="178" fill="#94a3b8" font-size="10" text-anchor="middle">ContractComparison (/contracts)</text>
    <text x="665" y="193" fill="#94a3b8" font-size="10" text-anchor="middle">Evaluate (/evaluate) • cvcEngine</text>

    <!-- Client Data & Fallback Layer -->
    <rect x="52" y="216" width="696" height="54" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="400" y="236" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">Resilient Client Transport, State &amp; Offline Fallback Layer</text>
    <text x="400" y="253" fill="#94a3b8" font-size="10" text-anchor="middle">src/lib/api.ts (8s AbortController) • useApiResource • DataStatusProvider • ConnectionBadge • DataOriginNotice • src/lib/fallbacks.ts</text>
  </g>

  <!-- ==================== TIER 2: FASTAPI ASYNC GATEWAY & ROUTERS ==================== -->
  <g filter="url(#dropShadow)">
    <rect x="35" y="320" width="730" height="150" rx="12" fill="#1e293b" stroke="#0d9488" stroke-width="1.5"/>
    <rect x="35" y="320" width="730" height="34" rx="12" fill="url(#apiHeader)"/>
    <text x="55" y="342" fill="#ffffff" font-size="13" font-weight="700" letter-spacing="0.8">BACKEND API TIER — FASTAPI 0.115 &amp; PYDANTIC V2 ROUTERS (PORT 8000)</text>

    <rect x="52" y="366" width="222" height="90" rx="8" fill="#0f172a" stroke="#2dd4bf" stroke-width="1"/>
    <text x="163" y="386" fill="#ccfbf1" font-size="12" font-weight="600" text-anchor="middle">Ports &amp; Berth Match</text>
    <text x="163" y="403" fill="#cbd5e1" font-size="10" text-anchor="middle">GET /api/ports</text>
    <text x="163" y="418" fill="#cbd5e1" font-size="10" text-anchor="middle">GET /api/ports/{port}/berths</text>
    <text x="163" y="433" fill="#cbd5e1" font-size="10" text-anchor="middle">GET /api/ports/catalog</text>
    <text x="163" y="448" fill="#cbd5e1" font-size="10" text-anchor="middle">POST /api/match</text>

    <rect x="289" y="366" width="222" height="90" rx="8" fill="#0f172a" stroke="#2dd4bf" stroke-width="1"/>
    <text x="400" y="386" fill="#ccfbf1" font-size="12" font-weight="600" text-anchor="middle">Forecasting &amp; Chartering</text>
    <text x="400" y="403" fill="#cbd5e1" font-size="10" text-anchor="middle">POST /api/forecast</text>
    <text x="400" y="418" fill="#cbd5e1" font-size="10" text-anchor="middle">POST /api/contract</text>
    <text x="400" y="433" fill="#cbd5e1" font-size="10" text-anchor="middle">POST /api/contract/multiport</text>
    <text x="400" y="448" fill="#cbd5e1" font-size="10" text-anchor="middle">POST /api/evaluate</text>

    <rect x="526" y="366" width="222" height="90" rx="8" fill="#0f172a" stroke="#2dd4bf" stroke-width="1"/>
    <text x="637" y="386" fill="#ccfbf1" font-size="12" font-weight="600" text-anchor="middle">Telemetry, Series &amp; Health</text>
    <text x="637" y="403" fill="#cbd5e1" font-size="10" text-anchor="middle">GET /api/series &amp; /api/series/metrics</text>
    <text x="637" y="418" fill="#cbd5e1" font-size="10" text-anchor="middle">GET /api/data/status</text>
    <text x="637" y="433" fill="#cbd5e1" font-size="10" text-anchor="middle">POST /api/data/refresh</text>
    <text x="637" y="448" fill="#cbd5e1" font-size="10" text-anchor="middle">GET /api/health</text>
  </g>

  <!-- ==================== TIER 3: QUANTITATIVE ML, COSTING & BERTH RESOLVER ==================== -->
  <g filter="url(#dropShadow)">
    <rect x="35" y="505" width="730" height="235" rx="12" fill="#1e293b" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="35" y="505" width="730" height="34" rx="12" fill="url(#mlHeader)"/>
    <text x="55" y="527" fill="#ffffff" font-size="13" font-weight="700" letter-spacing="0.8">QUANTITATIVE FORECASTING, COSTING &amp; BERTH RESOLUTION ENGINES</text>

    <!-- SARIMAX Engine -->
    <rect x="52" y="552" width="222" height="172" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1"/>
    <text x="163" y="572" fill="#ede9fe" font-size="12" font-weight="700" text-anchor="middle">SARIMAX Projection Engine</text>
    <text x="163" y="589" fill="#cbd5e1" font-size="10" text-anchor="middle">backend/models/project.py</text>
    <text x="163" y="607" fill="#94a3b8" font-size="10" text-anchor="middle">• Log-space SARIMAX(1,1,1) + Exog</text>
    <text x="163" y="623" fill="#94a3b8" font-size="10" text-anchor="middle">• Kalman Filter apply(refit=False)</text>
    <text x="163" y="639" fill="#94a3b8" font-size="10" text-anchor="middle">• OWN_DRIVER Circularity Guard</text>
    <text x="163" y="655" fill="#94a3b8" font-size="10" text-anchor="middle">• Fourier Seasonality + Monsoon Step</text>
    <text x="163" y="671" fill="#94a3b8" font-size="10" text-anchor="middle">• p80 / p95 Asymmetric Intervals</text>
    <text x="163" y="687" fill="#94a3b8" font-size="10" text-anchor="middle">• Rolling-Origin 4-Fold Backtest</text>
    <text x="163" y="703" fill="#94a3b8" font-size="10" text-anchor="middle">• L-BFGS + Nelder-Mead Warm Start</text>

    <!-- Berth & Lighterage Resolver -->
    <rect x="289" y="552" width="222" height="172" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1"/>
    <text x="400" y="572" fill="#ede9fe" font-size="12" font-weight="700" text-anchor="middle">Berth &amp; Lighterage Resolver</text>
    <text x="400" y="589" fill="#cbd5e1" font-size="10" text-anchor="middle">backend/data/ports/resolver.py</text>
    <text x="400" y="607" fill="#94a3b8" font-size="10" text-anchor="middle">• Three-Valued Verdict:</text>
    <text x="400" y="623" fill="#6ee7b7" font-size="10" text-anchor="middle">  ACCEPT_ALL_TIDE / HIGH_TIDE / REJECT</text>
    <text x="400" y="639" fill="#94a3b8" font-size="10" text-anchor="middle">• UKC Margin (0.4m) &amp; Comfort Bands</text>
    <text x="400" y="655" fill="#94a3b8" font-size="10" text-anchor="middle">• Immersion: TONNES_PER_CM (38–108)</text>
    <text x="400" y="671" fill="#94a3b8" font-size="10" text-anchor="middle">• Sandheads / Sagar Barge Lighterage</text>
    <text x="400" y="687" fill="#94a3b8" font-size="10" text-anchor="middle">• Vizag Outer vs Inner Basin Split</text>
    <text x="400" y="703" fill="#94a3b8" font-size="10" text-anchor="middle">• Per-Berth Provenance URL &amp; Date</text>

    <!-- Voyage Costing & CVC/PTC Arbiter -->
    <rect x="526" y="552" width="222" height="172" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1"/>
    <text x="637" y="572" fill="#ede9fe" font-size="12" font-weight="700" text-anchor="middle">Voyage Costing &amp; CVC Engine</text>
    <text x="637" y="589" fill="#cbd5e1" font-size="10" text-anchor="middle">backend/app/costing.py</text>
    <text x="637" y="607" fill="#94a3b8" font-size="10" text-anchor="middle">• Spot vs CVC vs Period TC (PTC)</text>
    <text x="637" y="623" fill="#94a3b8" font-size="10" text-anchor="middle">• BAF Hedge (0.7) &amp; Wait Reduction</text>
    <text x="637" y="639" fill="#94a3b8" font-size="10" text-anchor="middle">• Correlated Error Band (rho=0.7)</text>
    <text x="637" y="655" fill="#94a3b8" font-size="10" text-anchor="middle">• Break-Even USD/t &amp; Normal CDF</text>
    <text x="637" y="671" fill="#94a3b8" font-size="10" text-anchor="middle">• Multi-Port Split Cargo Optimiser</text>
    <text x="637" y="687" fill="#94a3b8" font-size="10" text-anchor="middle">• Quantile GBR Pipeline (engine/)</text>
    <text x="637" y="703" fill="#94a3b8" font-size="10" text-anchor="middle">• INR Crore &amp; USD Dual Accounting</text>
  </g>

  <!-- ==================== TIER 4: EXTERNAL MARKET ADAPTERS (TOP RIGHT) ==================== -->
  <g filter="url(#dropShadow)">
    <rect x="805" y="95" width="360" height="310" rx="12" fill="#1e293b" stroke="#db2777" stroke-width="1.5"/>
    <rect x="805" y="95" width="360" height="34" rx="12" fill="url(#adapterHeader)"/>
    <text x="825" y="117" fill="#ffffff" font-size="13" font-weight="700" letter-spacing="0.8">INGESTION ADAPTERS &amp; EXTERNAL FEEDS</text>

    <rect x="822" y="142" width="326" height="50" rx="8" fill="#0f172a" stroke="#f472b6" stroke-width="1"/>
    <text x="985" y="162" fill="#fce7f3" font-size="11" font-weight="600" text-anchor="middle">Baltic &amp; Dry-Bulk Equity Proxies</text>
    <text x="985" y="179" fill="#94a3b8" font-size="10" text-anchor="middle">TradingEconomics (BDIY:IND) • Yahoo Finance (GOGL, SBLK)</text>

    <rect x="822" y="200" width="326" height="50" rx="8" fill="#0f172a" stroke="#f472b6" stroke-width="1"/>
    <text x="985" y="220" fill="#fce7f3" font-size="11" font-weight="600" text-anchor="middle">Commodity Futures &amp; FRED Macro</text>
    <text x="985" y="237" fill="#94a3b8" font-size="10" text-anchor="middle">Coal (MTF=F / PCOALAUUSDM) • Iron Ore (TIO=F) • DEXINUS / DEXUSAL</text>

    <rect x="822" y="258" width="326" height="50" rx="8" fill="#0f172a" stroke="#f472b6" stroke-width="1"/>
    <text x="985" y="278" fill="#fce7f3" font-size="11" font-weight="600" text-anchor="middle">Weather, Bunker, Congestion &amp; AIS</text>
    <text x="985" y="295" fill="#94a3b8" font-size="10" text-anchor="middle">Open-Meteo Marine • bunker_vlsfo.csv • congestion.json • AIS</text>

    <rect x="822" y="316" width="326" height="74" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
    <text x="985" y="336" fill="#a7f3d0" font-size="11" font-weight="700" text-anchor="middle">APScheduler &amp; Failure-Isolated Ingestion</text>
    <text x="985" y="353" fill="#cbd5e1" font-size="10" text-anchor="middle">Hourly ingest.refresh_all() • SourceAdapter.safe_fetch()</text>
    <text x="985" y="369" fill="#94a3b8" font-size="10" text-anchor="middle">Zero network calls on request path • Proxy &amp; Staleness Tagging</text>
  </g>

  <!-- ==================== TIER 5: SQLITE WAL CACHE & REFERENCE ARTIFACTS (BOTTOM RIGHT) ==================== -->
  <g filter="url(#dropShadow)">
    <rect x="805" y="435" width="360" height="305" rx="12" fill="#1e293b" stroke="#d97706" stroke-width="1.5"/>
    <rect x="805" y="435" width="360" height="34" rx="12" fill="url(#storageHeader)"/>
    <text x="825" y="457" fill="#ffffff" font-size="13" font-weight="700" letter-spacing="0.8">STORAGE, SNAPSHOT &amp; MODEL ARTIFACTS</text>

    <rect x="822" y="482" width="326" height="68" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
    <text x="985" y="502" fill="#fef3c7" font-size="12" font-weight="600" text-anchor="middle">SQLite WAL Cache (backend/data/cache.db)</text>
    <text x="985" y="519" fill="#cbd5e1" font-size="10" text-anchor="middle">Table: observations (metric, timestamp PK, value, source)</text>
    <text x="985" y="535" fill="#cbd5e1" font-size="10" text-anchor="middle">Table: source_status (is_stale, is_proxy, row_count, error)</text>

    <rect x="822" y="562" width="326" height="62" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
    <text x="985" y="582" fill="#fef3c7" font-size="12" font-weight="600" text-anchor="middle">Committed Offline Snapshot &amp; Port Tables</text>
    <text x="985" y="599" fill="#cbd5e1" font-size="10" text-anchor="middle">data/snapshot.json (Cold-Boot Seed) • PROVENANCE.md</text>
    <text x="985" y="614" fill="#94a3b8" font-size="10" text-anchor="middle">data/ports/berths.csv • data/ports/lighterage_nodes.csv</text>

    <rect x="822" y="636" width="326" height="86" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
    <text x="985" y="656" fill="#fef3c7" font-size="12" font-weight="600" text-anchor="middle">Trained Model Pickles &amp; Historical Parquet</text>
    <text x="985" y="673" fill="#cbd5e1" font-size="10" text-anchor="middle">models/sarimax_{handysize,supramax,panamax,capesize}.pkl</text>
    <text x="985" y="689" fill="#cbd5e1" font-size="10" text-anchor="middle">models/metrics.json (Rolling Backtest MAPE &amp; RMSE)</text>
    <text x="985" y="705" fill="#94a3b8" font-size="10" text-anchor="middle">data/historical/*.parquet &amp; p10/p50/p90 .joblib Quantile Models</text>
  </g>

  <!-- ==================== DATA FLOW ARROWS ==================== -->
  <!-- Client to FastAPI -->
  <line x1="250" y1="285" x2="250" y2="318" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="125" y="306" fill="#7dd3fc" font-size="10" font-weight="600">REST JSON (GET/POST)</text>

  <line x1="550" y1="320" x2="550" y2="287" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="562" y="306" fill="#6ee7b7" font-size="10" font-weight="600">Typed DTO + Freshness Metadata</text>

  <!-- FastAPI to Quantitative Engine -->
  <line x1="163" y1="470" x2="400" y2="503" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowViolet)"/>
  <line x1="400" y1="470" x2="163" y2="503" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowViolet)"/>
  <line x1="400" y1="470" x2="637" y2="503" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowViolet)"/>

  <!-- Adapters to SQLite Cache -->
  <line x1="985" y1="405" x2="985" y2="433" stroke="#f472b6" stroke-width="2.5" marker-end="url(#arrowPink)"/>
  <text x="1000" y="423" fill="#f9a8d4" font-size="10" font-weight="600">Upsert Observations</text>

  <!-- Cache/Artifacts to FastAPI & Engine -->
  <path d="M 805 516 L 780 516 L 780 415 L 767 415" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <path d="M 805 595 L 767 595" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="769" y="583" fill="#fde68a" font-size="9">Read-Only</text>

  <!-- ==================== VISUAL LEGEND ==================== -->
  <g filter="url(#dropShadow)">
    <rect x="35" y="760" width="1130" height="75" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="55" y="783" fill="#f8fafc" font-size="12" font-weight="700" letter-spacing="0.6">ARCHITECTURE LEGEND &amp; SYSTEM BOUNDARIES</text>

    <rect x="55" y="798" width="16" height="16" rx="4" fill="url(#uiHeader)"/>
    <text x="78" y="810" fill="#cbd5e1" font-size="11">React 19 Command Deck (Vite 8)</text>

    <rect x="285" y="798" width="16" height="16" rx="4" fill="url(#apiHeader)"/>
    <text x="308" y="810" fill="#cbd5e1" font-size="11">FastAPI Gateway &amp; Routers</text>

    <rect x="490" y="798" width="16" height="16" rx="4" fill="url(#mlHeader)"/>
    <text x="513" y="810" fill="#cbd5e1" font-size="11">SARIMAX, Berth &amp; CVC Engines</text>

    <rect x="715" y="798" width="16" height="16" rx="4" fill="url(#adapterHeader)"/>
    <text x="738" y="810" fill="#cbd5e1" font-size="11">Market &amp; Weather Adapters</text>

    <rect x="925" y="798" width="16" height="16" rx="4" fill="url(#storageHeader)"/>
    <text x="948" y="810" fill="#cbd5e1" font-size="11">SQLite WAL Cache &amp; Pickles</text>
  </g>
</svg>
